name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run gates
        run: >
          python -m speclab gates
          --require-identical
          --min-acceptance 0.6
          --min-eval-savings 0.5
      - name: Check stochastic demo and figure
        run: |
          python -m speclab.stochastic demo > /tmp/stochastic-demo.json
          cmp /tmp/stochastic-demo.json examples/stochastic-demo.json
          python examples/render_stochastic.py --check
      - name: Check oracle policy demo and figure
        run: |
          python -m speclab.policy demo > /tmp/policy-demo.json
          cmp /tmp/policy-demo.json examples/policy-demo.json
          python examples/render_policy.py --check
      - name: Check within-proposal stopping controls and independent replay
        run: |
          python -m speclab.stopping_cli demo > /tmp/stopping-fixtures.json
          python examples/check_stopping.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: node --test tests/test_stopping.cjs tests/test_stopping_browser.cjs
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip wheel . --no-deps -w /tmp/wheels
      - run: python -m pip install --target /tmp/installed /tmp/wheels/*.whl
      - run: |
          python -m speclab evaluate --format json > /tmp/source-evaluate.json
          (cd /tmp && PYTHONPATH=/tmp/installed python -m speclab evaluate --format json) > /tmp/wheel-evaluate.json
          cmp /tmp/source-evaluate.json /tmp/wheel-evaluate.json
          python -m speclab gates --require-identical --min-acceptance 0.6 --min-eval-savings 0.5 > /tmp/source-gates.txt
          (cd /tmp && PYTHONPATH=/tmp/installed python -m speclab gates --require-identical --min-acceptance 0.6 --min-eval-savings 0.5) > /tmp/wheel-gates.txt
          cmp /tmp/source-gates.txt /tmp/wheel-gates.txt
          for mode in demo audit sample; do
            if [ "$mode" = demo ]; then
              python -m speclab.stochastic "$mode" > /tmp/source-$mode.json
              (cd /tmp && PYTHONPATH=/tmp/installed python -m speclab.stochastic "$mode") > /tmp/wheel-$mode.json
            else
              python -m speclab.stochastic "$mode" examples/stochastic-input.json > /tmp/source-$mode.json
              (cd /tmp && PYTHONPATH=/tmp/installed python -m speclab.stochastic "$mode" "$GITHUB_WORKSPACE/examples/stochastic-input.json") > /tmp/wheel-$mode.json
            fi
            cmp /tmp/source-$mode.json /tmp/wheel-$mode.json
          done
          for mode in demo optimize; do
            if [ "$mode" = demo ]; then
              python -m speclab.policy "$mode" > /tmp/source-policy-$mode.json
              (cd /tmp && PYTHONPATH=/tmp/installed python -m speclab.policy "$mode") > /tmp/wheel-policy-$mode.json
            else
              python -m speclab.policy "$mode" examples/policy-input.json > /tmp/source-policy-$mode.json
              (cd /tmp && PYTHONPATH=/tmp/installed python -m speclab.policy "$mode" "$GITHUB_WORKSPACE/examples/policy-input.json") > /tmp/wheel-policy-$mode.json
            fi
            cmp /tmp/source-policy-$mode.json /tmp/wheel-policy-$mode.json
          done
      - name: Compare installed stopping CLI and independent verifier
        run: |
          python -m speclab.stopping_cli audit examples/stopping-input.json > /tmp/source-stopping.json
          (cd /tmp && PYTHONPATH=/tmp/installed python -m speclab.stopping_cli audit "$GITHUB_WORKSPACE/examples/stopping-input.json") > /tmp/wheel-stopping.json
          cmp /tmp/source-stopping.json /tmp/wheel-stopping.json
          (cd /tmp && PYTHONPATH=/tmp/installed python -m speclab.stopping_cli verify "$GITHUB_WORKSPACE/examples/stopping-input.json" /tmp/wheel-stopping.json)
          python -m speclab.stopping_cli demo > /tmp/source-stopping-demo.json
          (cd /tmp && PYTHONPATH=/tmp/installed python -m speclab.stopping_cli demo) > /tmp/wheel-stopping-demo.json
          cmp /tmp/source-stopping-demo.json /tmp/wheel-stopping-demo.json
