[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "speclab"
version = "0.4.0"
description = "Exact speculative sampling, oracle lookahead and within-proposal stopping evidence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["speclab*"]
