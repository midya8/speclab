[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "speclab"
version = "0.2.0"
description = "Greedy speculative verification and exact finite stochastic sampling audits"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["speclab*"]
