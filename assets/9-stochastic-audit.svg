<text x="42" y="58" font-size="25" font-weight="700">SpecLab / exact sampling is more than matching greedy tokens</text>
<text x="42" y="90" font-size="17" class="muted">Finite supplied autoregressive tables. Rational probability laws and explicit decoder-position counts.</text>
<text x="42" y="137" font-size="22" font-weight="700">1 Rejection needs a residual, not a fresh target draw</text>
<text x="42" y="170" font-size="18" >Accept x with min(1, p(x)/q(x)); on rejection draw from normalized max(0,p-q).</text>
